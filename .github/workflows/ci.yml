name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: Lint PHP (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: php -l ทุกไฟล์ใน site/api
        run: |
          set -e
          n=0
          while IFS= read -r -d '' f; do
            php -l "$f"
            n=$((n+1))
          done < <(find site/api -name '*.php' -print0)
          echo "✓ linted $n PHP files"

  web-check:
    name: Check JS / JSON (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node --check ทุกไฟล์ JS
        run: |
          set -e
          for f in site/assets/js/*.js site/admin/admin.js site/sw.js; do
            node --check "$f" && echo "ok: $f"
          done
      - name: เทสต์เอนจินแกะคอร์ด (DSP benchmark กับเสียงสังเคราะห์)
        run: node tools/test-dsp.cjs
      - name: เทสต์ประกอบ ChordPro (คอร์ด+เนื้อร้อง)
        run: node tools/test-assemble.cjs
      - name: เทสต์แกะลายโซโล่/ริฟฟ์ → แท็บกีตาร์ (เสียงสังเคราะห์)
        run: node tools/test-riff.cjs
      - name: เทสต์ฝึกกับไมค์ (pitch/คอร์ด/onset/ตัดสินจังหวะ — เสียงสังเคราะห์)
        run: node --expose-gc tools/test-practice.cjs
      - name: เทสต์เรียบเรียง fingerstyle (ทำนอง+เบส+คอร์ด → แท็บที่เล่นได้จริง)
        run: node tools/test-finger.cjs
      - name: เทสต์แกะไลน์หลายเครื่องดนตรี → แทร็กโน้ต (HPSS/กลอง/Basic Pitch oracle/Demucs stub/analyze hook)
        run: node tools/test-tracks.cjs
      - name: เทสต์จัดเนื้อร้องจากผู้ใช้ให้ตรงเพลง (ถอดผิด/ท่อนซ้ำ/คอร์ดบนพยางค์)
        run: node tools/test-lyricfix.cjs
      - name: เทสต์ตัวกันลูปของ Whisper (token จริง — เนื้อร้องจริงต้องผ่านครบ ลูปต้องจบเร็ว)
        run: node tools/test-lyrics-guard.cjs
      - name: เทสต์เกลาโน้ตตามหลักดนตรี (กติกาทีละข้อ + โน้ตจากโมเดลจริงเทียบโน้ตจริง)
        run: node tools/test-polish.cjs
      - name: เทสต์เขียนไฟล์ MIDI (SMF type 1 จากแทร็กโน้ต)
        run: node tools/test-midi.cjs
      - name: เทสต์โน้ตเพลง (ทำนอง → ABC/โน้ตสากล/โน้ตไทย)
        run: node tools/test-notation.cjs
      - name: ตรวจ JSON (manifest, version)
        run: |
          node -e "JSON.parse(require('fs').readFileSync('site/manifest.webmanifest','utf8'));console.log('manifest ok')"
          node -e "JSON.parse(require('fs').readFileSync('site/version.json','utf8'));console.log('version.json ok')"
      - name: VERSION เป็น semver
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$V"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION ไม่ใช่ semver"; exit 1; }
