<!doctype html>
<html lang="th" data-lang="th" data-motion="on">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050b14" />
  <meta name="color-scheme" content="dark" />
  <title>AquaChord — แกะคอร์ดเพลงด้วย AI ในเครื่องคุณ</title>
  <meta name="description" content="AquaChord — แกะคอร์ดกีตาร์และเนื้อร้องจากไฟล์เสียงด้วย AI บนเครื่องคุณเอง ไม่อัปโหลดไฟล์ ดูท่าจับ ฟังเสียงคอร์ด เปลี่ยนคีย์/คาโป้ ใช้ออฟไลน์และติดตั้งบนมือถือได้" />
  <meta property="og:title" content="AquaChord — แกะคอร์ดเพลงด้วย AI" />
  <meta property="og:description" content="แกะคอร์ดและเนื้อร้องจากไฟล์เสียงบนเครื่องคุณ 100% · ห้องคอร์ด · เปลี่ยนคีย์/คาโป้ · ใช้ออฟไลน์ได้" />
  <meta property="og:image" content="icons/pwa-512.png" />

  <link rel="icon" href="assets/brand/mark-64.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/styles.css" />
  <script>
    /* ตั้งค่า Motion ก่อน paint (ค่าเริ่มต้นตามระบบ "ลดการเคลื่อนไหว") */
    (function () {
      var m = null;
      try { m = localStorage.getItem('aq.motion'); } catch (e) {}
      if (m !== 'on' && m !== 'off') m = (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'off' : 'on';
      var d = document.documentElement;
      d.setAttribute('data-motion', m);
      d.className += ' js';
      try { var l = localStorage.getItem('aq.lang'); if (l === 'en' || l === 'th') { d.setAttribute('lang', l); d.setAttribute('data-lang', l); } } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#view" data-i18n="a11y.skip">ข้ามไปเนื้อหา</a>
  <div class="nebula" aria-hidden="true"></div>
  <canvas id="sky" aria-hidden="true"></canvas>

  <aside class="sidebar" aria-label="AquaChord">
    <a class="brand" href="#/" aria-label="AquaChord">
      <img src="assets/brand/logo-520.webp" alt="AquaChord" width="184" height="149" decoding="async" />
    </a>
    <div class="side-caption" data-i18n="side.caption">AI CHORD STUDIO</div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-divider"></div>
    <div class="side-note">
      <div class="tiny-label" data-i18n="side.noteLabel">ON-DEVICE AI</div>
      <p data-i18n-html="side.note"></p>
    </div>
    <button class="side-tour" id="sideTour" type="button">
      <img src="assets/guide/face-160.webp" alt="" width="44" height="44" />
      <span><b data-i18n="side.tour">ให้อควาพาทัวร์</b><small data-i18n="side.tourSub">ไกด์ประจำสตูดิโอ</small></span>
    </button>
  </aside>

  <div class="shell">
    <header class="topbar">
      <a class="mobile-brand" href="#/" aria-label="AquaChord">
        <img src="assets/brand/mark-96.webp" alt="" width="30" height="34" />
        <span>Aqua<b>Chord</b></span>
      </a>
      <div class="breadcrumb"><span class="crumb-root">AQUACHORD</span><span class="crumb-sep">/</span><b id="crumbHere"></b></div>
      <button class="job-pill" id="jobPill" type="button" hidden></button>
      <label class="search top-search" id="topSearchWrap">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <input id="topSearch" type="search" autocomplete="off" enterkeyhint="search" data-i18n-ph="search.placeholder" data-i18n-aria="search.placeholder" />
        <span class="search-hint" id="topSearchHint"></span>
        <kbd>/</kbd>
      </label>
      <button class="pill-button icon-only m-search" id="mSearch" type="button" data-i18n-aria="search.placeholder">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      </button>
      <button class="pill-button motion-btn" id="motionBtn" type="button"></button>
      <button class="pill-button lang-btn" id="langToggle" type="button" data-i18n-aria="settings.language">
        <span class="lang-th">TH</span><span class="lang-sep">/</span><span class="lang-en">EN</span>
      </button>
      <button class="pill-button accent install-btn" id="installBtn" type="button" hidden>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11.5M7.5 11L12 15.5 16.5 11M4.5 20h15"/></svg>
        <span data-i18n="install">ติดตั้งแอป</span>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <footer class="site-foot">
      <span>© 2026 AquaChord · <a href="#/settings" data-i18n="foot.settings">ตั้งค่า &amp; นโยบาย</a></span>
      <span class="foot-motto">Let the waves carry the melody.</span>
    </footer>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="AquaChord"></nav>
  <div id="nowPlaying" class="now-playing" role="status" hidden></div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <noscript><div class="noscript">AquaChord ต้องเปิด JavaScript · Please enable JavaScript.</div></noscript>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/music.js"></script>
  <script src="assets/js/chordpro.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/dsp.js"></script>
  <script src="assets/js/riff.js"></script>
  <script src="assets/js/lyrics.js"></script>
  <script src="assets/js/analyze.js"></script>
  <script src="assets/js/fx.js"></script>
  <script src="assets/js/guide.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
